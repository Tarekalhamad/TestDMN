server.port=${PORT:8080}

# Fail fast on a type mismatch in the input rather than evaluating against nulls.
org.kie.dmn.runtime.typecheck=true

# Where the live, editable rule model lives. Seeded from the classpath on first start.
dmn.editor.storage-path=${user.dir}/dmn-storage

# The Kogito plugin stays on as a build-time DMN validator, but generates no REST resource:
# traffic is served by the hot-reload runtime so that GUI edits and the API can never disagree.
kogito.generate.rest=false

# Only scan our own package - the Kogito-generated classes carry $ref annotations springdoc
# cannot parse.
springdoc.packages-to-scan=com.example.discount
springdoc.swagger-ui.path=/swagger-ui.html
